[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "wasm32-unknown-unknown"]
all-features = false

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93
include-dev = true

# Exceptions pair a crate name with reviewed licenses across versions.
# Restrict versions only when approval depends on release-specific licensing.
# Leptos WASM split macro helper; reviewed LICENSE-CC0.
[[licenses.exceptions]]
crate = "base16"
allow = ["CC0-1.0"]

# Leptos/server_fn hashing dependency; reviewed the bundled Boost license.
[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

# Axum route matcher; reviewed LICENSE and LICENSE.router (MIT AND BSD).
[[licenses.exceptions]]
crate = "matchit"
allow = ["BSD-3-Clause"]

# Build-only asset compressor; reviewed LICENSE.BSD-3-Clause and LICENSE.MIT.
[[licenses.exceptions]]
crate = "brotli"
allow = ["BSD-3-Clause"]

# Brotli's build/test allocators; same upstream BSD license.
[[licenses.exceptions]]
crate = "alloc-no-stdlib"
allow = ["BSD-3-Clause"]
[[licenses.exceptions]]
crate = "alloc-stdlib"
allow = ["BSD-3-Clause"]

# bcrypt constant-time primitives; reviewed the bundled BSD license.
[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

# Reqwest platform verifier trust data; reviewed bundled LICENSE.
# Sharing this data requires retaining the agreement; no copyleft on code/results.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary sqlx-sqlite pin for RUSTSEC-2026-0459; require an exact revision.
allow-git = ["https://github.com/transact-rs/sqlx"]
required-git-spec = "rev"

# Resource parser and MIME/TLS dependencies with reviewed licenses.
# Unmodified MPL parser dependencies retain their upstream notices and source links.
# Shared CSS crates cover HTML rewriting, sanitization and scraper diagnostics.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "lol_html"
allow = ["BSD-3-Clause"]
[[licenses.exceptions]]
crate = "encoding_rs"
allow = ["BSD-3-Clause"]
[[licenses.exceptions]]
crate = "quoted_printable"
allow = ["0BSD"]
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]
