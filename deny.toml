[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "wasm32-unknown-unknown"]
all-features = false

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93
include-dev = true

# Leptos WASM split macro helper; reviewed LICENSE-CC0 in this exact crate.
[[licenses.exceptions]]
crate = "base16@=0.2.1"
allow = ["CC0-1.0"]

# Leptos/server_fn hashing dependency; reviewed the bundled Boost license.
[[licenses.exceptions]]
crate = "xxhash-rust@=0.8.19"
allow = ["BSL-1.0"]

# Axum route matcher; reviewed LICENSE and LICENSE.router (MIT AND BSD).
[[licenses.exceptions]]
crate = "matchit@=0.8.4"
allow = ["BSD-3-Clause"]

# bcrypt constant-time primitives; reviewed the bundled BSD license.
[[licenses.exceptions]]
crate = "subtle@=2.6.1"
allow = ["BSD-3-Clause"]

# Reqwest platform verifier trust data; reviewed bundled LICENSE.
# Sharing this data requires retaining the agreement; no copyleft on code/results.
[[licenses.exceptions]]
crate = "webpki-root-certs@=1.0.10"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Resource parser and MIME/TLS dependencies, reviewed at these exact releases.
# Unmodified MPL parser dependencies retain their upstream notices and source links.
[[licenses.exceptions]]
crate = "cssparser@=0.36.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros@=0.6.1"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "dtoa-short@=0.3.5"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors@=0.37.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "lol_html@=3.0.1"
allow = ["BSD-3-Clause"]
[[licenses.exceptions]]
crate = "encoding_rs@=0.8.42"
allow = ["BSD-3-Clause"]
[[licenses.exceptions]]
crate = "quoted_printable@=0.5.2"
allow = ["0BSD"]
[[licenses.exceptions]]
crate = "webpki-roots@=1.0.10"
allow = ["CDLA-Permissive-2.0"]

# Ammonia final-document sanitizer; unchanged upstream CSS parser and retained notice.
[[licenses.exceptions]]
crate = "cssparser@=0.38.0"
allow = ["MPL-2.0"]

# Unmodified scraper diagnostics dependencies. Bundled CSS licenses are byte-identical
# to the retained MPL text; selectors retains its upstream file notices/source link.
[[licenses.exceptions]]
crate = "cssparser@=0.37.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros@=0.7.1"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors@=0.38.0"
allow = ["MPL-2.0"]
