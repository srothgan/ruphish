[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
all-features = false

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93
include-dev = true

# Leptos WASM split macro helper; reviewed LICENSE-CC0 in this exact crate.
[[licenses.exceptions]]
crate = "base16@=0.2.1"
allow = ["CC0-1.0"]

# Leptos/server_fn hashing dependency; reviewed the bundled Boost license.
[[licenses.exceptions]]
crate = "xxhash-rust@=0.8.19"
allow = ["BSL-1.0"]

# Axum route matcher; reviewed LICENSE and LICENSE.router (MIT AND BSD).
[[licenses.exceptions]]
crate = "matchit@=0.8.4"
allow = ["BSD-3-Clause"]

# bcrypt constant-time primitives; reviewed the bundled BSD license.
[[licenses.exceptions]]
crate = "subtle@=2.6.1"
allow = ["BSD-3-Clause"]

# Dev-only reqwest platform verifier's trust data; reviewed bundled LICENSE.
# Sharing this data requires retaining the agreement; no copyleft on code/results.
[[licenses.exceptions]]
crate = "webpki-root-certs@=1.0.9"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
