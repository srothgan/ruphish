[package]
name = "ruphish-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
autobins = false

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

# Cargo ignores dependency-workspace patches. Keep these aligned with the product
# workspace; the dependency_graph test checks the patches and shared lock entries.
[patch.crates-io]
sqlx-core = { path = "../vendor/sqlx-core" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

[patch."https://github.com/transact-rs/sqlx"]
sqlx-core = { path = "../vendor/sqlx-core" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "matched-path", "multipart", "query", "tokio"] }
base64 = "0.23"
libfuzzer-sys = "=0.4.13"
ruphish-adapters = { version = "0.1.0", path = "../crates/ruphish-adapters", features = ["fuzzing"] }
ruphish-application = { version = "0.1.0", path = "../crates/ruphish-application" }
ruphish-contracts = { version = "0.1.0", path = "../crates/ruphish-contracts" }
ruphish-http = { version = "0.1.0", path = "../crates/ruphish-http" }
scraper = { version = "0.29", default-features = false, features = ["errors"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
toml = "1"

[[bin]]
name = "submission_decode"
path = "fuzz_targets/submission_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_routing"
path = "fuzz_targets/public_routing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mailbox_identify"
path = "fuzz_targets/mailbox_identify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template_render"
path = "fuzz_targets/template_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_import"
path = "fuzz_targets/csv_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_bundle_raw"
path = "fuzz_targets/page_bundle_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_bundle_structured"
path = "fuzz_targets/page_bundle_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "email_html"
path = "fuzz_targets/email_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "landing_html"
path = "fuzz_targets/landing_html.rs"
test = false
doc = false
bench = false
