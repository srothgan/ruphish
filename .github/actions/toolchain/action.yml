name: Validation toolchain
description: Restore reusable dependencies and install pinned tools; does not run checks.
inputs:
  browser:
    description: Install Trunk and the WASM test runner
    default: 'false'
  format-ui:
    description: Install Leptos formatter
    default: 'false'
  dependencies:
    description: Install cargo-deny
    default: 'false'
  cache-group:
    description: Separate incompatible compilation workloads
    default: native
  cache-save:
    description: Populate the dependency cache from this job when writes are allowed
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '26.8.1'
        package-manager-cache: false
    - name: Select pinned Rust toolchain
      shell: bash
      run: |
        rustup show
        echo "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
    - name: Read enforced cache access
      id: cache
      # The runner injects ACTIONS_CACHE_MODE into Node actions, not shell steps.
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const mode = process.env.ACTIONS_CACHE_MODE;
          if (!['read', 'write', 'none'].includes(mode)) throw new Error('Unexpected cache mode: ' + mode);
          core.setOutput('restore', mode !== 'none');
          core.setOutput('save', mode === 'write');
    - name: Reuse compiled dependencies
      if: steps.cache.outputs.restore == 'true' && inputs.dependencies != 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: dependencies-v1
        shared-key: ${{ inputs.cache-group }}
        cache-bin: 'false'
        save-if: ${{ steps.cache.outputs.save == 'true' && inputs.cache-save == 'true' }}
    - name: Restore pinned tools
      if: steps.cache.outputs.restore == 'true' && (inputs.browser == 'true' || inputs.format-ui == 'true' || inputs.dependencies == 'true')
      id: tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .ci-tools
        key: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.browser }}-${{ inputs.format-ui }}-${{ inputs.dependencies }}-${{ hashFiles('rust-toolchain.toml', 'Trunk.toml', '.github/actions/toolchain/action.yml', '.github/actions/trunk/**') }}
    - name: Install pinned precompiled Trunk
      if: inputs.browser == 'true'
      uses: ./.github/actions/trunk
    - name: Install WASM test runner if missing
      if: inputs.browser == 'true'
      shell: bash
      run: |
        if ! command -v wasm-bindgen-test-runner >/dev/null; then cargo install wasm-bindgen-cli --version 0.2.129 --locked --profile dev --root .ci-tools; fi
    - name: Install formatter if missing
      if: inputs.format-ui == 'true'
      shell: bash
      run: |
        if ! command -v leptosfmt >/dev/null; then cargo install leptosfmt --version 0.1.33 --locked --profile dev --root .ci-tools; fi
    - name: Install dependency checker if missing
      if: inputs.dependencies == 'true'
      shell: bash
      run: |
        if ! command -v cargo-deny >/dev/null; then cargo install cargo-deny --version 0.19.9 --locked --profile dev --root .ci-tools; fi
    - name: Save pinned tools
      if: steps.cache.outputs.save == 'true' && steps.tools.outputs.cache-hit != 'true' && (inputs.browser == 'true' || inputs.format-ui == 'true' || inputs.dependencies == 'true')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .ci-tools
        key: ${{ steps.tools.outputs.cache-primary-key }}
