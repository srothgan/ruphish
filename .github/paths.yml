# Broad ownership groups. Each selected group runs a fixed suite in validation.yml.
# Shared build inputs affect every product consumer; repository housekeeping does not.
# Script tests run in the always-selected quality job without selecting build suites.
product:
  - &build_inputs
    - '**/Cargo.toml'
    - 'Cargo.lock'
    - 'vendor/**'
    - 'rust-toolchain.toml'
    - '.cargo/**'
    - 'Trunk.toml'
    - 'rustfmt.toml'
    - 'leptosfmt.toml'
    - 'deny.toml'
    - '.gitattributes'
    - '.github/workflows/**'
    - '.github/actions/**'
    - '.github/paths.yml'
    - '.github/scripts/release.mjs'
    - '.github/scripts/release-publish.mjs'
    - '.github/scripts/github.mjs'
  - 'crates/**'
  - 'demo/**'
  - 'assets/website-demo/**'
  - 'config.example.json'
  - 'tests/**'
  - 'migrations/**'
  - 'Dockerfile'
  - 'compose.yaml'
  - '.dockerignore'
  - 'docker/**'

# Browser deployment inputs, including the starter content embedded by the demo.
# The workspace lockfile is deliberately conservative: backend dependency updates
# can still select this group, but backend implementation-only changes do not.
demo:
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - '.cargo/**'
  - 'Trunk.toml'
  - '.gitattributes'
  - 'crates/ruphish-ui/**'
  - 'crates/ruphish-domain/**'
  - 'crates/ruphish-contracts/**'
  - 'crates/ruphish-http/starter-templates/**'
  - 'crates/ruphish-http/src/starter_templates/**'
  - 'assets/website-demo/**'
  - 'demo/**'
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/scripts/release.mjs'
  - '.github/scripts/release-publish.mjs'
  - '.github/scripts/github.mjs'
  - '.github/paths.yml'

persistence:
  - *build_inputs
  - 'crates/ruphish-adapters/**'
  - 'crates/ruphish-application/**'
  - 'crates/ruphish-domain/**'
  - 'tests/**'
  - 'migrations/**'

public:
  - *build_inputs
  - 'crates/ruphish/src/config/**'
  - 'Dockerfile'
  - 'compose.yaml'
  - '.dockerignore'
  - 'docker/**'
  - 'LICENSE'
  - 'THIRD-PARTY-NOTICES.md'
  - 'tests/acceptance/**'

# Fuzzing selects fixed commands in fuzz.yml, independently of product acceptance.
fuzz_contracts:
  - &fuzz_inputs
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    - '.cargo/**'
    - 'vendor/**'
    - 'fuzz/Cargo.toml'
    - 'fuzz/Cargo.lock'
    - 'fuzz/rust-toolchain.toml'
    - 'fuzz/src/lib.rs'
    - 'fuzz/src/dependency_graph.rs'
    - '.github/paths.yml'
    - '.github/workflows/fuzz.yml'
  - 'crates/ruphish-contracts/**'
  - 'crates/ruphish-domain/**'
  - 'fuzz/src/submission.rs'
  - 'fuzz/fuzz_targets/submission_decode.rs'
  - 'fuzz/seeds/submission_decode/**'

fuzz_http:
  - *fuzz_inputs
  - 'crates/ruphish-http/**'
  - 'crates/ruphish-contracts/**'
  - 'crates/ruphish-application/**'
  - 'crates/ruphish-domain/**'
  - 'fuzz/src/routing.rs'
  - 'fuzz/fuzz_targets/public_routing.rs'
  - 'fuzz/seeds/public_routing/**'

fuzz_adapters:
  - *fuzz_inputs
  - 'crates/ruphish-adapters/**'
  - 'crates/ruphish-application/**'
  - 'crates/ruphish-domain/**'
  - 'fuzz/src/mailbox.rs'
  - 'fuzz/src/template.rs'
  - 'fuzz/src/csv.rs'
  - 'fuzz/src/email_html.rs'
  - 'fuzz/src/landing.rs'
  - 'fuzz/src/bundle.rs'
  - 'fuzz/fuzz_targets/mailbox_identify.rs'
  - 'fuzz/fuzz_targets/template_render.rs'
  - 'fuzz/fuzz_targets/csv_import.rs'
  - 'fuzz/fuzz_targets/page_bundle_raw.rs'
  - 'fuzz/fuzz_targets/page_bundle_structured.rs'
  - 'fuzz/fuzz_targets/email_html.rs'
  - 'fuzz/fuzz_targets/landing_html.rs'
  - 'fuzz/seeds/mailbox_identify/**'
  - 'fuzz/seeds/template_render/**'
  - 'fuzz/seeds/csv_import/**'
  - 'fuzz/seeds/page_bundle_raw/**'
  - 'fuzz/seeds/page_bundle_structured/**'
  - 'fuzz/seeds/email_html/**'
  - 'fuzz/seeds/landing_html/**'
