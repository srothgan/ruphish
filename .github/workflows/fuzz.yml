name: Fuzzing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: 'true'
  CARGO_TERM_COLOR: never
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || '300' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contracts: ${{ github.event_name != 'pull_request' && 'true' || steps.paths.outputs.fuzz_contracts }}
      http: ${{ github.event_name != 'pull_request' && 'true' || steps.paths.outputs.fuzz_http }}
      adapters: ${{ github.event_name != 'pull_request' && 'true' || steps.paths.outputs.fuzz_adapters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: paths
        with:
          token: ''
          base: ${{ github.base_ref }}
          filters: .github/paths.yml

  fuzz-read:
    name: Fuzz selected boundaries
    needs: changes
    if: (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.http == 'true' || needs.changes.outputs.adapters == 'true') && !(github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults: &fuzz-defaults
      run:
        working-directory: fuzz
    steps: &fuzz-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup show
      - name: Read enforced cache access
        id: cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const mode = process.env.ACTIONS_CACHE_MODE;
            if (!['read', 'write'].includes(mode)) throw new Error('Unexpected fuzz cache mode: ' + mode);
            core.setOutput('save', mode === 'write');
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
          prefix-key: fuzz-dependencies-v1
          key: ${{ hashFiles('fuzz/rust-toolchain.toml') }}
          save-if: ${{ steps.cache.outputs.save == 'true' }}
      - name: Install cargo-fuzz
        run: cargo +1.99.1 install cargo-fuzz --version 0.13.2 --locked --profile dev
      - name: Fetch locked inputs and test harness assertions
        run: |
          cargo +1.99.1 fetch --locked
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 test --lib --locked
      - name: Restore exploration corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-
      - name: Prepare writable corpus directories
        run: mkdir -p corpus/submission_decode corpus/public_routing corpus/mailbox_identify corpus/template_render corpus/csv_import corpus/page_bundle_raw corpus/page_bundle_structured corpus/email_html corpus/landing_html
      - name: Fuzz closed submissions
        if: needs.changes.outputs.contracts == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run submission_decode corpus/submission_decode seeds/submission_decode -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=4096
      - name: Fuzz public routing
        if: needs.changes.outputs.http == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run public_routing corpus/public_routing seeds/public_routing -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=8192
      - name: Fuzz mailbox identification
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run mailbox_identify corpus/mailbox_identify seeds/mailbox_identify -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=65536
      - name: Fuzz template execution
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run template_render corpus/template_render seeds/template_render -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=65536
      - name: Fuzz CSV imports
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run csv_import corpus/csv_import seeds/csv_import -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=65536
      - name: Fuzz malformed page archives
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run page_bundle_raw corpus/page_bundle_raw seeds/page_bundle_raw -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=1048576
      - name: Fuzz structured page bundles
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run page_bundle_structured corpus/page_bundle_structured seeds/page_bundle_structured -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=32769
      - name: Fuzz email HTML
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run email_html corpus/email_html seeds/email_html -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=65536
      - name: Fuzz landing and learning HTML
        if: needs.changes.outputs.adapters == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run landing_html corpus/landing_html seeds/landing_html -- -max_total_time="$FUZZ_SECONDS" -timeout=5 -rss_limit_mb=2048 -max_len=65536
      - name: Check lockfiles remained unchanged
        if: always()
        working-directory: .
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - name: Retain reproductions and explored corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts
            fuzz/corpus
          if-no-files-found: ignore
          retention-days: 14
      - name: Save successful exploration corpus
        if: success() && steps.cache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}-${{ github.run_attempt }}

  fuzz-write:
    name: Fuzz all boundaries and retain corpus
    needs: changes
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    cache-mode: write
    defaults: *fuzz-defaults
    steps: *fuzz-steps
