name: Temporary website integration validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    if: github.head_ref == 'style/website-graphite-dark-theme'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Include the reviewed Astro update for integration validation
        run: |
          git -c user.name='Validation' -c user.email='validation@localhost' merge --no-commit --no-ff 8416d5e3033cf9488d36276f4bc534f1e57ba3ed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
        working-directory: website
      - run: node --test tools/theme.test.mjs tools/tabs.test.mjs tools/navigation.test.mjs
        working-directory: website
      - run: npx astro check
        working-directory: website
      - run: npx astro build
        working-directory: website
      - run: node --test tools/theme.artifact.mjs tools/titles.artifact.mjs
        working-directory: website
