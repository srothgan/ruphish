name: Shared validation

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
        description: Run every suite, including the bounded performance measurement

permissions:
  contents: read

env:
  NO_COLOR: 'true'
  CARGO_TERM_COLOR: never

jobs:
  changes:
    name: Paths, JavaScript and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      product: ${{ inputs.full && 'true' || steps.paths.outputs.product }}
      website: ${{ inputs.full && 'true' || steps.paths.outputs.website }}
      persistence: ${{ inputs.full && 'true' || steps.paths.outputs.persistence }}
      public: ${{ inputs.full && 'true' || steps.paths.outputs.public }}
      dependencies: ${{ inputs.full && 'true' || steps.paths.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Install JavaScript quality tools
        run: npm ci --ignore-scripts
      - name: Check JavaScript formatting
        run: npx --no-install prettier . --check
      - name: Lint maintained JavaScript
        run: npx --no-install eslint . --max-warnings=0
      - name: Check gate behavior and fixture initialization
        run: node --test .github/scripts/*.test.mjs demo/tests/vercel-output.test.mjs tests/acceptance/init.test.mjs
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck="" -pyflakes=""
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        if: ${{ !inputs.full }}
        with:
          # PRs compare with their base; pushes compare with the branch before the push.
          # Use Git without API permissions or file-count limits, including rename paths.
          token: ''
          base: ${{ github.base_ref || github.ref_name }}
          filters: .github/paths.yml

  website:
    name: Website and documentation
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: website/package.json
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --test tools/docs.test.mjs tools/ignore-build.test.mjs tools/navigation.test.mjs
      - run: npx astro check
      - run: npx astro build
      - run: node tools/check-site.mjs

  assets:
    name: Browser and real assets
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: distribution
        with:
          path: dist/admin
          key: admin-assets-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'Trunk.toml', 'crates/ruphish-ui/**', 'crates/ruphish-domain/**', 'crates/ruphish-contracts/**') }}
      - uses: ./.github/actions/toolchain
        with:
          browser: 'true'
          format-ui: 'true'
          cache-group: browser
      - name: Install browser dependencies
        run: npm ci --prefix crates/ruphish-ui/web
      - name: Browser Rust and Leptos formatting
        run: |
          cargo fmt --all -- --check
          leptosfmt --check crates/ruphish-ui/src crates/ruphish-ui/tests
      - name: JavaScript functionality
        run: node --test crates/ruphish-ui/web/tests/*.test.mjs
      - name: Generate browser inputs for direct WASM checks
        run: node crates/ruphish-ui/web/build.mjs
      - name: Browser Rust functionality and lint
        run: |
          cargo test -p ruphish-ui --lib --tests --locked
          cargo clippy -p ruphish-ui --lib --locked -- -D warnings
          cargo test -p ruphish-ui --test '*' --target wasm32-unknown-unknown --locked
          cargo clippy -p ruphish-ui --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p ruphish-ui --tests --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build development distribution
        if: steps.distribution.outputs.cache-hit != 'true'
        run: trunk build --locked
      - name: Built campaign routing and loading
        run: node --test crates/ruphish-ui/web/tests/campaign-routing.artifact.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: admin-distribution
          path: dist/admin/
          retention-days: 2
          if-no-files-found: error

  native:
    name: Linux native and executable acceptance
    needs: [changes, assets]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: admin-distribution
          path: dist/admin
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Install collector test dependencies
        run: npm ci --prefix crates/ruphish-ui/web
      - name: Native static checks
        run: cargo clippy --workspace --exclude ruphish-ui --all-targets --locked -- -D warnings
      - name: Complete native and executable functionality
        run: cargo test --workspace --exclude ruphish-ui --locked -- --nocapture
      - name: Shared demo dataset against the real SQLite executable
        run: node --test demo/tests/seed.test.mjs
      - name: Bounded audience performance measurement
        if: inputs.full
        run: cargo test -p ruphish-adapters --test campaign_storage measure_launch_read_claim_and_compose_at_legacy_audience_sizes --locked -- --ignored --exact --nocapture

  database:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    needs: [changes, assets]
    if: needs.changes.outputs.persistence == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            version: '8.4'
            image: mysql@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
          - engine: mysql
            version: '9.7'
            image: mysql@sha256:e2fa358a74ac81148e7e27d9433e4c0ab62133de8ea4428b4f39a51a4ba7d07f
          - engine: postgres
            version: '17'
            image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          - engine: postgres
            version: '18'
            image: postgres@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          cache-group: provider-${{ matrix.engine }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: admin-distribution
          path: dist/admin
      - name: Initialize only the canonical database fixture
        env:
          ENGINE: ${{ matrix.engine }}
          DATABASE_IMAGE: ${{ matrix.image }}
        run: |
          node tests/acceptance/lab.mjs init
          if [ "$ENGINE" = mysql ]; then
            echo "RUPHISH_MYSQL_IMAGE=$DATABASE_IMAGE" >> "$GITHUB_ENV"
            export RUPHISH_MYSQL_IMAGE="$DATABASE_IMAGE"
          else
            echo "RUPHISH_POSTGRES_IMAGE=$DATABASE_IMAGE" >> "$GITHUB_ENV"
            export RUPHISH_POSTGRES_IMAGE="$DATABASE_IMAGE"
          fi
          docker compose -f tests/acceptance/compose.yaml run --rm prepare "--$ENGINE"
          docker compose -f tests/acceptance/compose.yaml --profile database up -d --wait "$ENGINE"
          if [ "$ENGINE" = mysql ]; then
            endpoint=$(docker compose -f tests/acceptance/compose.yaml port mysql 3306)
            echo "RUPHISH_MYSQL_TEST_PORT=${endpoint##*:}" >> "$GITHUB_ENV"
          else
            endpoint=$(docker compose -f tests/acceptance/compose.yaml port postgres 5432)
            echo "RUPHISH_POSTGRES_TEST_PORT=${endpoint##*:}" >> "$GITHUB_ENV"
          fi
      - name: MySQL full histories and contracts
        if: matrix.engine == 'mysql'
        run: |
          cargo test -p ruphish-adapters --test mysql_preflight --locked -- --ignored --nocapture
          cargo test -p ruphish-adapters --test database_providers mysql_ --locked -- --ignored --nocapture
      - name: PostgreSQL full schema and recovery contracts
        if: matrix.engine == 'postgres'
        run: cargo test -p ruphish-adapters --test database_providers postgres_ --locked -- --ignored --nocapture
      - name: Complete provider executable workflow
        env:
          PROCESS_FILTER: ${{ matrix.engine }}_process
        run: cargo test -p ruphish --test startup_process "$PROCESS_FILTER" --locked -- --ignored --nocapture
      - name: Remove only the disposable database service
        if: always()
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          docker compose -f tests/acceptance/compose.yaml stop "$ENGINE"
          docker compose -f tests/acceptance/compose.yaml rm -f "$ENGINE"

  platforms:
    name: Native acceptance on ${{ matrix.runner }}
    needs: [changes, assets]
    if: needs.changes.outputs.product == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Use the native shell: Git Bash makes Windows children ignore Ctrl+C.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: admin-distribution
          path: dist/admin
      - name: Install collector and platform asset dependencies
        run: npm ci --prefix crates/ruphish-ui/web
      - name: Native static checks
        run: cargo clippy --workspace --exclude ruphish-ui --all-targets --locked -- -D warnings
      - name: Complete platform functionality
        # Keep disposable fixtures on job storage, not Windows' user-profile disk.
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo test --workspace --exclude ruphish-ui --locked -- --nocapture
      - name: Platform asset promotion
        run: node --test crates/ruphish-ui/web/tests/distribution.test.mjs

  dependencies:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          dependencies: 'true'
          cache-group: policy
      - run: npm audit --prefix crates/ruphish-ui/web
      - run: npm audit
      - run: cargo deny check bans licenses sources advisories

  public:
    name: Docker DNS TLS SMTP acceptance
    needs: [changes, assets]
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: admin-distribution
          path: dist/admin
      - name: Canonical public fixture
        run: |
          node tests/acceptance/lab.mjs init
          docker compose -f tests/acceptance/compose.yaml --profile setup run --rm prepare
          docker compose -f tests/acceptance/compose.yaml build app
          docker compose -f tests/acceptance/compose.yaml up -d --wait dns inbox app
          node tests/acceptance/lab.mjs demo
          node tests/acceptance/lab.mjs seed
          node --test tests/acceptance/public.test.mjs
      - name: Stop fixture without deleting persistent application data
        if: always()
        run: docker compose -f tests/acceptance/compose.yaml stop app dns inbox

  gate:
    name: Validation gate
    needs: [changes, website, assets, native, database, platforms, dependencies, public]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.changes.result !== 'success') throw new Error('Path checks failed or were cancelled');
          const groups = jobs.changes.outputs;
          for (const group of ['product', 'website', 'persistence', 'dependencies', 'public']) {
            if (!['true', 'false'].includes(groups[group])) throw new Error('Missing path group: ' + group);
          }
          const required = {
            website: groups.website,
            assets: groups.product,
            native: groups.product,
            platforms: groups.product,
            database: groups.persistence,
            dependencies: groups.dependencies,
            public: groups.public,
          };
          for (const [job, selected] of Object.entries(required)) {
            const expected = selected === 'true' ? 'success' : 'skipped';
            if (jobs[job].result !== expected) throw new Error(job + ': expected ' + expected + ', got ' + jobs[job].result);
          }
          NODE
