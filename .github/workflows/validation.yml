name: Shared validation

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: auto
        description: auto, native, ui, databases or full

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
  TOKIO_WORKER_THREADS: '2'
  RAYON_NUM_THREADS: '2'
  NO_COLOR: 'true'
  CARGO_TERM_COLOR: never

jobs:
  select:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.selection.outputs.native }}
      ui: ${{ steps.selection.outputs.ui }}
      website: ${{ steps.selection.outputs.website }}
      dependencies: ${{ steps.selection.outputs.dependencies }}
      smoke: ${{ steps.selection.outputs.smoke }}
      full: ${{ steps.selection.outputs.full }}
      migration: ${{ steps.selection.outputs.migration }}
      provider_process: ${{ steps.selection.outputs.provider_process }}
      assets: ${{ steps.selection.outputs.assets }}
      process: ${{ steps.selection.outputs.process }}
      process_filters: ${{ steps.selection.outputs.process_filters }}
      database: ${{ steps.selection.outputs.database }}
      database_matrix: ${{ steps.selection.outputs.database_matrix }}
      public: ${{ steps.selection.outputs.public }}
      platform_full: ${{ steps.selection.outputs.platform_full }}
      rust_format: ${{ steps.selection.outputs.rust_format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Check selection policy
        run: node --test .github/scripts/select.test.mjs
      - name: Lint workflows
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=1'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck="" -pyflakes=""
      - id: selection
        name: Select from the complete PR diff
        env:
          VALIDATION_PROFILE: ${{ inputs.profile }}
        run: node .github/scripts/select.mjs

  website:
    name: Website and documentation
    needs: select
    if: needs.select.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --test tools/docs.test.mjs tools/ignore-build.test.mjs
      - run: npx astro check
      - run: npx astro build
      - run: node tools/check-site.mjs

  assets:
    name: Browser and real assets
    needs: select
    if: needs.select.outputs.assets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: distribution
        with:
          path: dist/admin
          key: admin-assets-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'Trunk.toml', 'crates/ruphish-ui/**', 'crates/ruphish-domain/**', 'crates/ruphish-contracts/**') }}
      - uses: ./.github/actions/toolchain
        with:
          browser: ${{ needs.select.outputs.ui == 'true' || steps.distribution.outputs.cache-hit != 'true' }}
          format-ui: ${{ needs.select.outputs.ui }}
          cache-group: browser
      - name: Install browser dependencies
        if: needs.select.outputs.ui == 'true' || steps.distribution.outputs.cache-hit != 'true'
        run: npm ci --prefix crates/ruphish-ui/web
      - name: Browser formatting
        if: needs.select.outputs.ui == 'true'
        run: |
          cargo fmt --all -- --check
          leptosfmt --check crates/ruphish-ui/src crates/ruphish-ui/tests
      - name: JavaScript functionality
        if: needs.select.outputs.ui == 'true'
        run: node --test --test-concurrency=1 crates/ruphish-ui/web/tests/*.test.mjs
      - name: Generate browser inputs for direct WASM checks
        if: needs.select.outputs.ui == 'true'
        run: node crates/ruphish-ui/web/build.mjs
      - name: Browser Rust functionality and lint
        if: needs.select.outputs.ui == 'true'
        run: |
          cargo test -p ruphish-ui --lib --tests --locked
          cargo clippy -p ruphish-ui --lib --locked -- -D warnings
          cargo test -p ruphish-ui --test '*' --target wasm32-unknown-unknown --locked
          cargo clippy -p ruphish-ui --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p ruphish-ui --tests --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build development distribution
        if: steps.distribution.outputs.cache-hit != 'true'
        run: trunk build --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: admin-distribution
          path: dist/admin/
          retention-days: 2
          if-no-files-found: error

  native:
    name: Native baseline
    needs: select
    if: needs.select.outputs.native == 'true' || needs.select.outputs.rust_format == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Allow fixtures to bind the standard HTTPS port
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Native static checks
        if: needs.select.outputs.native == 'true'
        run: cargo clippy --workspace --exclude ruphish-ui --all-targets --locked -- -D warnings
      - name: Library and HTTP functionality
        if: needs.select.outputs.native == 'true' && needs.select.outputs.full != 'true'
        run: |
          cargo test --workspace --exclude ruphish --exclude ruphish-ui --lib --locked
          cargo test -p ruphish-domain --tests --locked
          cargo test -p ruphish-http --test transport_compatibility --locked
          cargo test -p ruphish --bin ruphish --test workspace --test startup_cli --test compatibility_workflow --locked
      - name: SQLite and adapter contracts
        if: needs.select.outputs.native == 'true' && needs.select.outputs.full != 'true'
        run: |
          cargo test -p ruphish-adapters --test accounts --test campaign_storage --test campaign_transport --test database_facade --test legacy_auth --test legacy_templates --test overview --test public_domains --test reporting --test resource_formats --test session_store --test startup_database --test tls_files --locked
          cargo test -p ruphish-adapters --test database_providers sqlite_ --locked
          cargo test -p ruphish-adapters --test mysql_preflight mysql_configuration --locked
      - name: Historical SQLite upgrades
        if: needs.select.outputs.migration == 'true' && needs.select.outputs.full != 'true'
        run: cargo test -p ruphish-adapters --test sqlite_upgrade --locked

  process:
    name: Executable workflows
    needs: [select, native, assets]
    if: >-
      always() && needs.select.result == 'success' && needs.assets.result == 'success' &&
      (needs.native.result == 'success' || needs.native.result == 'skipped') &&
      (needs.select.outputs.smoke == 'true' || needs.select.outputs.process == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Allow fixtures to bind the standard HTTPS port
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: admin-distribution
          path: dist/admin
      - name: Complete native acceptance
        if: needs.select.outputs.full == 'true'
        run: cargo test --workspace --exclude ruphish-ui --locked -- --nocapture --test-threads=1
      - name: Bounded audience performance measurement
        if: needs.select.outputs.full == 'true'
        run: cargo test -p ruphish-adapters --test campaign_storage measure_launch_read_claim_and_compose_at_legacy_audience_sizes --locked -- --ignored --exact --nocapture --test-threads=1
      - name: Asset and shutdown smoke
        if: needs.select.outputs.full != 'true' && needs.select.outputs.process_filters != '[""]'
        run: |
          cargo test -p ruphish --test startup_process actual_http_servers_serve_built_assets_isolate_public_routes_and_shutdown_on_real_ctrl_c --locked -- --exact --nocapture --test-threads=1
      - name: Resource persistence smoke
        if: needs.select.outputs.full != 'true' && needs.select.outputs.process_filters != '[""]' && !contains(fromJSON(needs.select.outputs.process_filters), 'auth_process::')
        run: cargo test -p ruphish --test startup_process auth_process::browser_resource_create_read_edit_and_reload_routes_preserve_saved_data --locked -- --exact --nocapture --test-threads=1
      - name: Delivery smoke
        if: needs.select.outputs.full != 'true' && needs.select.outputs.process_filters != '[""]' && !contains(fromJSON(needs.select.outputs.process_filters), 'campaign_process::')
        run: cargo test -p ruphish --test startup_process campaign_process::executable_launch_delivers_personalized_mail_once_and_persists_acceptance_across_restart --locked -- --exact --nocapture --test-threads=1
      - name: Privacy smoke
        if: needs.select.outputs.full != 'true' && needs.select.outputs.process_filters != '[""]' && !contains(fromJSON(needs.select.outputs.process_filters), 'public_process::')
        run: cargo test -p ruphish --test startup_process public_process::verified_domain_to_campaign_to_private_events_survives_restart_and_rejects_bypasses --locked -- --exact --nocapture --test-threads=1
      - name: Shared or unclassified runtime changes
        if: needs.select.outputs.full != 'true' && needs.select.outputs.process_filters == '[""]'
        run: cargo test -p ruphish --test startup_process --locked -- --nocapture --test-threads=1
      - name: Authentication workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'auth_process::')
        run: |
          cargo test -p ruphish --test startup_process auth_process:: --locked -- --nocapture --test-threads=1
      - name: Campaign workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'campaign_process::')
        run: |
          cargo test -p ruphish --test startup_process campaign_process:: --locked -- --nocapture --test-threads=1
      - name: Resource workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'resource_process::')
        run: |
          cargo test -p ruphish --test startup_process resource_process:: --locked -- --nocapture --test-threads=1
      - name: Public workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'public_process::')
        run: |
          cargo test -p ruphish --test startup_process public_process:: --locked -- --nocapture --test-threads=1
      - name: Proxy workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'campaign_process::proxy_process::') && !contains(fromJSON(needs.select.outputs.process_filters), 'campaign_process::')
        run: |
          cargo test -p ruphish --test startup_process campaign_process::proxy_process:: --locked -- --nocapture --test-threads=1
      - name: Reporting workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'reporting_process::')
        run: |
          cargo test -p ruphish --test startup_process reporting_process:: --locked -- --nocapture --test-threads=1
      - name: Overview workflows
        if: needs.select.outputs.full != 'true' && contains(fromJSON(needs.select.outputs.process_filters), 'overview_process::')
        run: |
          cargo test -p ruphish --test startup_process overview_process:: --locked -- --nocapture --test-threads=1

  database:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    needs: [select, native, assets]
    if: >-
      always() && needs.select.result == 'success' && needs.native.result == 'success' &&
      (needs.assets.result == 'success' || needs.assets.result == 'skipped') && needs.select.outputs.database == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.database_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.select.outputs.assets == 'true'
        with:
          name: admin-distribution
          path: dist/admin
      - name: Initialize only the canonical database fixture
        env:
          ENGINE: ${{ matrix.engine }}
          DATABASE_IMAGE: ${{ matrix.image }}
        run: |
          node tests/acceptance/lab.mjs init
          if [ "$ENGINE" = mysql ]; then
            echo "RUPHISH_MYSQL_IMAGE=$DATABASE_IMAGE" >> "$GITHUB_ENV"
            export RUPHISH_MYSQL_IMAGE="$DATABASE_IMAGE"
          else
            echo "RUPHISH_POSTGRES_IMAGE=$DATABASE_IMAGE" >> "$GITHUB_ENV"
            export RUPHISH_POSTGRES_IMAGE="$DATABASE_IMAGE"
          fi
          docker compose -f tests/acceptance/compose.yaml run --rm prepare "--$ENGINE"
          docker compose -f tests/acceptance/compose.yaml --profile database up -d --wait "$ENGINE"
          if [ "$ENGINE" = mysql ]; then
            endpoint=$(docker compose -f tests/acceptance/compose.yaml port mysql 3306)
            echo "RUPHISH_MYSQL_TEST_PORT=${endpoint##*:}" >> "$GITHUB_ENV"
          else
            endpoint=$(docker compose -f tests/acceptance/compose.yaml port postgres 5432)
            echo "RUPHISH_POSTGRES_TEST_PORT=${endpoint##*:}" >> "$GITHUB_ENV"
          fi
      - name: MySQL transport and ordinary contracts
        if: matrix.engine == 'mysql' && needs.select.outputs.migration != 'true'
        run: |
          cargo test -p ruphish-adapters --test mysql_preflight mysql_preflight_transport --locked -- --ignored --nocapture --test-threads=1
          cargo test -p ruphish-adapters --test database_providers mysql_ --locked -- --ignored --nocapture --test-threads=1 --skip mysql_upgrades_every_legacy_version --skip mysql_failed_publication --skip mysql_rejects_schema_drift_dirty_history --skip mysql_legacy_queue --skip mysql_preferences_migrate
      - name: MySQL full histories and contracts
        if: matrix.engine == 'mysql' && needs.select.outputs.migration == 'true'
        run: |
          cargo test -p ruphish-adapters --test mysql_preflight --locked -- --ignored --nocapture --test-threads=1
          cargo test -p ruphish-adapters --test database_providers mysql_ --locked -- --ignored --nocapture --test-threads=1
      - name: PostgreSQL ordinary contracts
        if: matrix.engine == 'postgres' && needs.select.outputs.migration != 'true'
        run: cargo test -p ruphish-adapters --test database_providers postgres_ --locked -- --ignored --nocapture --test-threads=1 --skip postgres_rejects_modified_history --skip postgres_schema_drift --skip postgres_failed_ddl --skip postgres_migration_lock --skip postgres_preferences_migrate
      - name: PostgreSQL full schema and recovery contracts
        if: matrix.engine == 'postgres' && needs.select.outputs.migration == 'true'
        run: cargo test -p ruphish-adapters --test database_providers postgres_ --locked -- --ignored --nocapture --test-threads=1
      - name: Complete provider executable workflow
        if: needs.select.outputs.provider_process == 'true'
        env:
          PROCESS_FILTER: ${{ matrix.engine }}_process
        run: cargo test -p ruphish --test startup_process "$PROCESS_FILTER" --locked -- --ignored --nocapture --test-threads=1
      - name: Remove only the disposable database service
        if: always()
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          docker compose -f tests/acceptance/compose.yaml stop "$ENGINE"
          docker compose -f tests/acceptance/compose.yaml rm -f "$ENGINE"

  platforms:
    name: Native acceptance on ${{ matrix.runner }}
    needs: [select, assets]
    if: >-
      always() && needs.select.result == 'success' &&
      (needs.assets.result == 'success' || needs.assets.result == 'skipped') &&
      (needs.select.outputs.native == 'true' || needs.select.outputs.platform_full == 'true')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.select.outputs.assets == 'true'
        with:
          name: admin-distribution
          path: dist/admin
      - name: Native static checks
        run: cargo clippy --workspace --exclude ruphish-ui --all-targets --locked -- -D warnings
      - name: Ordinary native functionality
        if: needs.select.outputs.platform_full != 'true'
        run: |
          cargo test --workspace --exclude ruphish --exclude ruphish-ui --lib --locked
          cargo test -p ruphish-domain --tests --locked
          cargo test -p ruphish --bin ruphish --test workspace --test startup_cli --test compatibility_workflow --locked
      - name: Complete platform functionality
        if: needs.select.outputs.platform_full == 'true'
        run: cargo test --workspace --exclude ruphish-ui --locked -- --nocapture --test-threads=1
      - name: Platform asset promotion
        run: |
          npm ci --prefix crates/ruphish-ui/web
          node --test crates/ruphish-ui/web/tests/distribution.test.mjs

  dependencies:
    name: Dependency policy
    needs: select
    if: needs.select.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          dependencies: 'true'
          cache-group: policy
      - run: npm audit --prefix crates/ruphish-ui/web
      - run: cargo deny check bans licenses sources advisories

  public:
    name: Docker DNS TLS SMTP acceptance
    needs: [select, assets]
    if: needs.select.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: admin-distribution
          path: dist/admin
      - name: Canonical public fixture
        run: |
          node tests/acceptance/lab.mjs init
          docker compose -f tests/acceptance/compose.yaml --profile setup run --rm -e CARGO_BUILD_JOBS=1 prepare
          docker compose -f tests/acceptance/compose.yaml up -d dns inbox app
          node tests/acceptance/lab.mjs demo
          node tests/acceptance/lab.mjs seed
          node --test --test-concurrency=1 tests/acceptance/public.test.mjs
      - name: Stop fixture without deleting persistent application data
        if: always()
        run: docker compose -f tests/acceptance/compose.yaml stop app dns inbox

  gate:
    name: Validation gate
    needs: [select, website, assets, native, process, database, platforms, dependencies, public]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.select.result !== 'success') throw new Error('Selection failed or was cancelled');
          const flags = jobs.select.outputs;
          const expected = {
            website: flags.website === 'true',
            assets: flags.assets === 'true',
            native: flags.native === 'true' || flags.rust_format === 'true',
            process: flags.smoke === 'true' || flags.process === 'true',
            database: flags.database === 'true',
            platforms: flags.native === 'true' || flags.platform_full === 'true',
            dependencies: flags.dependencies === 'true',
            public: flags.public === 'true',
          };
          for (const [job, selected] of Object.entries(expected)) {
            const result = jobs[job].result;
            if (selected && result !== 'success') throw new Error(job + ': selected but ' + result);
            if (!selected && result !== 'skipped') throw new Error(job + ': unexpectedly ran (' + result + ')');
          }
          NODE
