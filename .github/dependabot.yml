version: 2
updates:
  # The workspace root owns all Rust crates and Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    labels:
      - "type: dependencies"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch

  # Repository-wide JavaScript formatting and lint tools.
  - package-ecosystem: npm
    directory: /
    labels:
      - "type: dependencies"
      - "area: ci"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling-minor-patch:
        update-types:
          - minor
          - patch

  # JavaScript dependencies used to build the administration interface.
  - package-ecosystem: npm
    directory: /crates/ruphish-ui/web
    labels:
      - "type: dependencies"
      - "area: ui"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      browser-minor-patch:
        update-types:
          - minor
          - patch

  # Astro, Starlight, fonts, and website development tools.
  - package-ecosystem: npm
    directory: /website
    labels:
      - "type: dependencies"
      - "area: website"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      website-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    labels:
      - "type: dependencies"
      - "area: ci"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
