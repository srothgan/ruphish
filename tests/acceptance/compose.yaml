name: ruphish-acceptance
services:
  postgres:
    image: ${RUPHISH_POSTGRES_IMAGE:-postgres@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c}
    profiles: [database]
    environment:
      POSTGRES_PASSWORD: ruphish-postgres-fixture-only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8
      PGDATA: /var/lib/postgresql/data
    entrypoint: [sh, /fixture/postgres-start.sh]
    volumes:
      - ${RUPHISH_ACCEPTANCE_DATA_DIRECTORY:-./data}/postgres:/tls:ro
      - ./postgres-start.sh:/fixture/postgres-start.sh:ro
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [lab]
  mysql:
    # One parameterized service in the canonical fixture; data is disposable.
    image: ${RUPHISH_MYSQL_IMAGE:-mysql@sha256:e2fa358a74ac81148e7e27d9433e4c0ab62133de8ea4428b4f39a51a4ba7d07f}
    profiles: [database]
    environment:
      MYSQL_ROOT_PASSWORD: ruphish-mysql-fixture-only
      MYSQL_ROOT_HOST: "%"
    command: [--ssl-ca=/tls/ca.pem, --ssl-cert=/tls/server.pem, --ssl-key=/tls/server.key]
    volumes:
      - ${RUPHISH_ACCEPTANCE_DATA_DIRECTORY:-./data}/mysql:/tls:ro
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -P, "3306"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [lab]
  prepare:
    image: rust:1.99.1-bookworm
    profiles: [setup]
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - ../..:/workspace:ro
      - .:/lab
      - ${RUPHISH_ACCEPTANCE_DATA_DIRECTORY:-./data}:/lab/data
      - target:/target
      - registry:/usr/local/cargo/registry
      - type: bind
        source: ../../target/docker
        target: /artifact
        bind:
          create_host_path: false
    entrypoint: [sh, /lab/prepare.sh]
  dns:
    image: coredns/coredns:1.14.7
    command: [-conf, /lab/Corefile]
    volumes:
      - .:/lab:ro
      - ${RUPHISH_ACCEPTANCE_DATA_DIRECTORY:-./data}:/lab/data:ro
    networks:
      lab:
        ipv4_address: 172.30.53.53
  inbox:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:8026:8025"
    networks:
      lab:
        ipv4_address: 172.30.53.20
  app:
    image: ${RUPHISH_APP_IMAGE:-ruphish:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${RUPHISH_IMAGE_VERSION:-local-development}
        REVISION: ${RUPHISH_IMAGE_REVISION:-unknown}
    command: [--config, /lab/data/config.json]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file: ${RUPHISH_ACCEPTANCE_DATA_DIRECTORY:-./data}/bootstrap.env
    volumes:
      - ${RUPHISH_ACCEPTANCE_DATA_DIRECTORY:-./data}:/lab/data
    ports:
      - "127.0.0.1:3334:3333"
      - "127.0.0.1:8443:8443"
    networks:
      lab:
        ipv4_address: 172.30.53.10
    depends_on: [dns, inbox]
    stop_grace_period: 30s
networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.53.0/24
volumes:
  target:
    name: ${RUPHISH_ACCEPTANCE_TARGET_VOLUME:-ruphish-acceptance-target}
  registry:
    name: ${RUPHISH_ACCEPTANCE_REGISTRY_VOLUME:-ruphish-acceptance-registry}
