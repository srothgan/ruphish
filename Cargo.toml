[workspace]
resolver = "3"
members = [
    "crates/ruphish-domain",
    "crates/ruphish-contracts",
    "crates/ruphish-application",
    "crates/ruphish-adapters",
    "crates/ruphish-http",
    "crates/ruphish-ui",
    "crates/ruphish",
]
default-members = [
    "crates/ruphish-domain",
    "crates/ruphish-contracts",
    "crates/ruphish-application",
    "crates/ruphish-adapters",
    "crates/ruphish-http",
    "crates/ruphish",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.metadata.tools]
cargo-deny = "0.19.9"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

