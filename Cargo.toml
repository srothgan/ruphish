[workspace]
resolver = "3"
exclude = ["vendor/sqlx-core"]
members = [
    "crates/ruphish-domain",
    "crates/ruphish-contracts",
    "crates/ruphish-application",
    "crates/ruphish-adapters",
    "crates/ruphish-http",
    "crates/ruphish-ui",
    "crates/ruphish",
]
default-members = [
    "crates/ruphish-domain",
    "crates/ruphish-contracts",
    "crates/ruphish-application",
    "crates/ruphish-adapters",
    "crates/ruphish-http",
    "crates/ruphish",
]

[workspace.package]
version = "0.1.0-dev.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.metadata.tools]
cargo-deny = "0.19.9"
leptosfmt = "0.1.33"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# WARNING: Temporary vendored SQLx fix from an unmerged upstream PR.
# TODO: Once https://github.com/transact-rs/sqlx/pull/4350 is merged, replace this
# path patch with an exact upstream Git revision containing the fix, validate it,
# and remove vendor/sqlx-core and its workspace exclusion. See its README.ruphish.md.
sqlx-core = { path = "vendor/sqlx-core" }
