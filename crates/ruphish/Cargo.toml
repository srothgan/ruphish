[package]
name = "ruphish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
embedded-assets = ["ruphish-http/embedded-assets"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
ruphish-adapters = { version = "0.1.0-dev", path = "../ruphish-adapters" }
ruphish-application = { version = "0.1.0-dev", path = "../ruphish-application" }
ruphish-http = { version = "0.1.0-dev", path = "../ruphish-http" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[[test]]
name = "workspace"
path = "../../tests/workspace.rs"

[[test]]
name = "compatibility_workflow"
path = "../../tests/compatibility_workflow.rs"

[[test]]
name = "startup_cli"
path = "../../tests/startup_cli.rs"

[[test]]
name = "startup_process"
path = "../../tests/startup_process.rs"

[lints]
workspace = true

[dev-dependencies]
brotli = "9.1.1"
flate2 = "1.1.10"
hex = "0.4.3"
hickory-proto = "0.26"
mail-parser = "0.11.9"
portable-pty = "0.9.0"
rcgen = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "form", "http2", "json", "rustls-no-provider"] }
ruphish-contracts = { path = "../ruphish-contracts" }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
toml = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.31.3", features = ["signal"] }
