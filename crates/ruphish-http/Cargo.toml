[package]
name = "ruphish-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hex = "0.4.3"
ruphish-application = { version = "0.1.0-dev", path = "../ruphish-application" }
ruphish-contracts = { version = "0.1.0-dev", path = "../ruphish-contracts" }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
