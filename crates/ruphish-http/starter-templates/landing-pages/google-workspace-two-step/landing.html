<!-- Independent simulation layout. See interactive-references.md for upstream references and adaptation boundaries. Existing embedded logo provenance remains in licenses/sources.json. -->
<style>* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: #1b1b1b; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .65; }
button:focus-visible, input:focus-visible { outline: 2px solid #0067b8; outline-offset: 3px; }
fieldset { min-inline-size: 0; border: 0; padding: 0; margin: 0; }
.page { min-height: 100vh; display: flex; flex-direction: column; }
.login-area { flex: 1; display: grid; place-items: center; padding: 48px 24px; }
.login { width: 100%; max-width: 440px; padding: 44px; background: #fff; box-shadow: 0 2px 6px #0003; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 21px; line-height: 24px; font-weight: 600; color: #737373; }
.brand img { display: block; width: 24px; height: 24px; }
h1 { font-size: 24px; line-height: 1.3; font-weight: 600; margin: 22px 0 12px; }
.intro { margin: 0 0 16px; }
.field { margin: 18px 0 8px; }
.field label { display: block; font-size: 13px; margin-bottom: 4px; }
.field input { width: 100%; height: 38px; border: 0; border-bottom: 1px solid #666; border-radius: 0; padding: 6px 0; background: #fff; color: inherit; }
.actions { display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 28px; }
.primary { min-width: 108px; min-height: 36px; padding: 7px 16px; border: 1px solid #0067b8; background: #0067b8; color: #fff; }
.primary:hover { background: #005da6; }
.text-button { padding: 6px 0; border: 0; background: transparent; color: #0067b8; text-align: left; }
.account-row { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; }
.account-row [data-account] { overflow-wrap: anywhere; }
.back { flex: 0 0 auto; width: 30px; min-height: 30px; border: 0; background: transparent; color: inherit; font-size: 22px; }
.back:hover { background: #eee; border-radius: 50%; }
.reveal { display: flex; gap: 9px; align-items: center; margin-top: 16px; font-size: 13px; }
.reveal input { width: 18px; height: 18px; margin: 0; accent-color: #0067b8; }
.footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 20px; padding: 12px 24px; font-size: 12px; color: #555; }
.footer a { color: inherit; text-decoration: none; }
.footer a:hover { text-decoration: underline; }
[data-failure] { color: #b10e1e; }
.form-notice { font-size: 13px; }
.noscript { margin: 16px; padding: 16px; background: #fff; color: #b10e1e; }
@media (max-width: 600px) { .login-area { padding: 24px; align-items: start; } .login { padding: 16px 0; box-shadow: none; } body { background: #fff !important; } .footer { justify-content: flex-start; } }
body { background: #f0f4f9; color: #1f1f1f; font-family: Arial, sans-serif; }
.login { max-width: 1040px; padding: 36px; border-radius: 28px; box-shadow: none; }
.brand { font-size: 20px; color: #444746; font-weight: 400; }
.brand img { width: 48px; height: 48px; }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
h1 { font-size: 36px; line-height: 1.25; font-weight: 400; margin: 24px 0 16px; }
form { padding-top: 24px; }
.field { margin-top: 16px; }
.field input { height: 56px; border: 1px solid #747775; border-radius: 4px; padding: 13px 15px; }
.field label { color: #444746; }
.primary { border-radius: 24px; min-height: 40px; min-width: 80px; background: #0b57d0; border-color: #0b57d0; padding: 10px 24px; }
.primary:hover { background: #0842a0; }
.text-button { color: #0b57d0; }
.reveal { font-size: 14px; }
.account-row { border: 1px solid #747775; border-radius: 20px; padding: 2px 9px; width: fit-content; max-width: 100%; font-size: 14px; }
.account-row .back { font-size: 18px; }
.actions { margin-top: 40px; }
.footer { width: min(1040px, 100%); margin: 0 auto; padding-bottom: 28px; }
@media (max-width: 760px) { .columns { grid-template-columns: 1fr; gap: 8px; } .login { padding: 28px; } h1 { font-size: 32px; } form { padding-top: 0; } }
@media (max-width: 600px) { .login { padding: 0; border-radius: 0; } }

.account-row:has([data-account][hidden]) { display: none; }
