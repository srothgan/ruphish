[package]
name = "ruphish-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.2"
argon2 = "0.6.0"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
base64 = "0.23"
bcrypt = "0.19.3"
cssparser = "0.38.0"
csv = { version = "1", default-features = false }
futures-util = "0.3.34"
getrandom = "0.4.3"
gtmpl-ng = "1.0.0"
hex = "0.4.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
hmac = "0.13.0"
ipnet = { version = "2", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "ring", "smtp-transport", "tokio1-rustls-tls", "webpki-roots"] }
lol_html = "3"
mail-parser = "0.11"
md-5 = "0.11.0"
percent-encoding = "2"
rcgen = "0.14.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
ruphish-application = { version = "0.1.0-dev", path = "../ruphish-application" }
ruphish-domain = { version = "0.1.0-dev", path = "../ruphish-domain" }
rust_xlsxwriter = { version = "0.101", features = ["constant_memory"] }
rustls-native-certs = "0.8"
scraper = { version = "0.29", default-features = false, features = ["errors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "mysql", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring-webpki"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.3", features = ["rt", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-sessions-core = "0.15.0"
url = "2"
webpki-roots = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
hickory-proto = "0.26"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-permissions = "0.2.4"
